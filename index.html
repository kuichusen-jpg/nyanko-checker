  <style>
    /* --- 基本デザイン --- */
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 50px;
    }

    /* --- 上部固定ステータスバー --- */
    .status-bar {
      position: sticky;
      top: 0;
      background: rgba(30, 30, 30, 0.95);
      padding: 15px;
      border-bottom: 2px solid #ffcc00;
      z-index: 100;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .status-info {
      font-size: 1.1em;
      font-weight: bold;
    }

    #status {
      color: #ffcc00;
      font-size: 1.4em;
    }

    /* --- リセットボタン --- */
    .reset-btn {
      padding: 6px 12px;
      cursor: pointer;
      background-color: #ff4444;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8em;
    }

    /* --- カテゴリー見出し --- */
    h2 {
      border-left: 5px solid #ffcc00;
      padding-left: 10px;
      margin: 20px 10px 10px;
      font-size: 1.1em;
      color: #ffcc00;
    }

    /* --- グリッドレイアウト --- */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      padding: 10px;
      align-items: start;
    }

    /* --- キャラクター1体分の枠 --- */
    .char-item {
      margin: 0;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- 画像の設定 --- */
    .char-item img {
      width: 100%;
      height: auto;
      min-height: 60px;
      background-color: #333;
      filter: brightness(0.3) grayscale(0.7);
      transition: filter 0.2s, border-color 0.2s;
      border-radius: 6px;
      border: 2px solid #444;
      display: block;
    }

    /* --- 名前（figcaption）のデザイン --- */
    .char-item figcaption {
      font-size: 10px;
      margin-top: 5px;
      color: #999;
      line-height: 1.2;
      word-break: break-all;
    }

    /* --- 所持済みの状態 --- */
    .char-item.owned img {
      filter: brightness(1.0) grayscale(0);
      border-color: #ffcc00;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
    }

    .char-item.owned figcaption {
      color: #ffcc00;
      font-weight: bold;
    }

    /* --- 形態切り替え時のアニメーション（回転） --- */
    .form-changing {
      animation: rotate-change 0.4s ease-in-out;
    }

    @keyframes rotate-change {
      0% {
        transform: rotateY(0deg);
        opacity: 1;
      }
      50% {
        transform: rotateY(90deg);
        opacity: 0.8;
      }
      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }
  </style>

    // --- 2. HTML生成関数 【修正箇所】 ---
    function generateGrid(dataList, targetId) {
      const container = document.getElementById(targetId);
      if (!container) return;

      const html = dataList.map(char => {
        // forms配列がある場合はその最初の要素の情報を、ない場合は直下の情報を設定する
        const initialName = char.forms ? char.forms[0].name : char.name;
        const initialImg = char.forms ? char.forms[0].img : `images/${char.id}.jpg`;
        
        return `
          <figure class="char-item" id="${char.id}" onclick="check(this)">
            <img src="${initialImg}" alt="${initialName}" class="char-img" loading="lazy">
            <figcaption class="char-name">${initialName}</figcaption>
          </figure>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // --- 3. ページ読み込み時の処理 ---
    window.onload = function() {
      generateGrid(dynamitesData, "list-dynamites");
      generateGrid(basalasData, "list-basalas");
      generateGrid(galsData, "list-gals");
      generateGrid(doragonData, "list-doragon");
      generateGrid(soulsData, "list-souls");
      generateGrid(herosData, "heros");
      generateGrid(zeusData, "zeus");
      generateGrid(ironData, "iron");
      generateGrid(pixysData, "pixys");
      generateGrid(zetumeiData, "zetumei");
      generateGrid(rugaData, "ruga");
      generateGrid(bustersData, "busters");
      generateGrid(chounekosaiData, "chounekosai");
      generateGrid(gokunekosaiData, "gokunekosai");
      generateGrid(valentineData, "valentine");
      generateGrid(whitedayData, "whiteday");
      generateGrid(easterData, "easter");
      generateGrid(juneData, "june");
      generateGrid(summerData, "summer");
      generateGrid(halloweenData, "halloween");
      generateGrid(chrismasData, "chrismas");
      generateGrid(extraData, "extra");

      loadProgress();
      updateStatus();
    };

    // --- 4. クリック時の処理（4ステップローテーション） ---
    function check(element) {
      const charId = element.id;
      let targetChar = null;

      for (const group of allDataGroups) {
        targetChar = group.find(c => c.id === charId);
        if (targetChar) break;
      }

      if (targetChar && targetChar.forms) {
        if (targetChar.currentForm === undefined) {
          targetChar.currentForm = -1;
        }

        targetChar.currentForm++;
        if (targetChar.currentForm >= targetChar.forms.length) {
          targetChar.currentForm = -1; 
        }

        updateElementVisual(element, targetChar);
      } else {
        element.classList.toggle("owned");
      }

      saveProgress();
      updateStatus();
    }

    // キャラクターの表示を更新する関数
    function updateElementVisual(element, targetChar) {
      if (!targetChar.forms) return;

      element.classList.add("form-changing");
      
      setTimeout(() => {
        if (targetChar.currentForm === undefined || targetChar.currentForm === -1) {
          element.classList.remove("owned");
          const firstForm = targetChar.forms[0];
          element.querySelector('.char-img').src = firstForm.img;
          element.querySelector('.char-name').textContent = firstForm.name;
        } else {
          element.classList.add("owned");
          const currentForm = targetChar.forms[targetChar.currentForm];
          element.querySelector('.char-img').src = currentForm.img;
          element.querySelector('.char-name').textContent = currentForm.name;
        }
      }, 200);

      setTimeout(() => {
        element.classList.remove("form-changing");
      }, 400);
    }

    // --- 5. 保存と復元 ---
    function saveProgress() {
      const progress = {};
      
      for (const group of allDataGroups) {
        for (const char of group) {
          if (char.forms) {
            if (char.currentForm !== undefined && char.currentForm !== -1) {
              progress[char.id] = char.currentForm;
            }
          } else {
            const el = document.getElementById(char.id);
            if (el && el.classList.contains("owned")) {
              progress[char.id] = true;
            }
          }
        }
      }
      localStorage.setItem("nyanko_save_v2", JSON.stringify(progress));
    }

    function loadProgress() {
      const savedData = localStorage.getItem("nyanko_save_v2");
      if (!savedData) return;
      
      const progress = JSON.parse(savedData);
      
      for (const group of allDataGroups) {
        for (const char of group) {
          if (progress[char.id] !== undefined) {
            const el = document.getElementById(char.id);
            if (!el) continue;

            if (char.forms) {
              char.currentForm = progress[char.id];
              updateElementVisual(el, char);
            } else {
              if (progress[char.id] === true) {
                el.classList.add("owned");
              }
            }
          }
        }
      }
    }

    function updateStatus() {
      const all = document.querySelectorAll(".char-item").length;
      const owned = document.querySelectorAll(".char-item.owned").length;
      const percent = all > 0 ? Math.floor((owned / all) * 100) : 0;
      document.getElementById("status").textContent = percent;
      document.getElementById("count-display").textContent = `(${owned}/${all})`;
    }

    function resetAll() {
      if (confirm("チェックをすべて外しますか？")) {
        for (const group of allDataGroups) {
          for (const char of group) {
            char.currentForm = -1;
            const el = document.getElementById(char.id);
            if (el) {
              el.classList.remove("owned");
              if (char.forms) {
                updateElementVisual(el, char);
              }
            }
          }
        }
        localStorage.removeItem("nyanko_save_v2");
        updateStatus();
      }
    }
  </script>
