  <style>
    /* --- 基本デザイン --- */
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 50px;
    }

    /* --- 上部固定ステータスバー --- */
    .status-bar {
      position: sticky;
      top: 0;
      background: rgba(30, 30, 30, 0.95);
      padding: 15px;
      border-bottom: 2px solid #ffcc00;
      z-index: 100;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .status-info {
      font-size: 1.1em;
      font-weight: bold;
    }

    #status {
      color: #ffcc00;
      font-size: 1.4em;
    }

    /* --- リセットボタン --- */
    .reset-btn {
      padding: 6px 12px;
      cursor: pointer;
      background-color: #ff4444;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8em;
    }

    /* --- カテゴリー見出し --- */
    h2 {
      border-left: 5px solid #ffcc00;
      padding-left: 10px;
      margin: 20px 10px 10px;
      font-size: 1.1em;
      color: #ffcc00;
    }

    /* --- グリッドレイアウト --- */
    .char-grid {
      display: grid;
      /* スマホで見やすいよう最小幅を80pxに設定 */
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      padding: 10px;
      align-items: start;
    }

    /* --- キャラクター1体分の枠 --- */
    .char-item {
      margin: 0;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent; /* スマホのタップ色を消す */
    }

    /* --- 画像の設定 --- */
    .char-item img {
      width: 100%;
      height: auto;
      min-height: 60px; /* 読み込み前のガタつき防止 */
      background-color: #333;
      filter: brightness(0.3) grayscale(0.7);
      transition: filter 0.2s, border-color 0.2s;
      border-radius: 6px;
      border: 2px solid #444;
      display: block;
    }

    /* --- 名前（figcaption）のデザイン --- */
    .char-item figcaption {
      font-size: 10px;
      margin-top: 5px;
      color: #999;
      line-height: 1.2;
      word-break: break-all;
    }

    /* --- 所持済みの状態（ownedクラスがついた時） --- */
    .char-item.owned img {
      filter: brightness(1.0) grayscale(0);
      border-color: #ffcc00;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
    }

    .char-item.owned figcaption {
      color: #ffcc00;
      font-weight: bold;
    }
  </style>
</head>

      const container = document.getElementById(targetId);
      if (!container) return;

          <img src="images/${char.id}.jpg" alt="${char.name}" loading="lazy">
          <figcaption>${char.name}</figcaption>
        </figure>
      `).join('');

      container.innerHTML = html;
    }

      generateGrid(bustersData, "busters");
      generateGrid(chounekosaiData, "chounekosai");
      generateGrid(gokunekosaiData, "gokunekosai");
      generateGrid(valentineData, "valentine");
      generateGrid(whitedayData, "whiteday");
      generateGrid(easterData, "easter");
      generateGrid(juneData, "june");
      generateGrid(summerData, "summer");
      generateGrid(halloweenData, "halloween");
      generateGrid(chrismasData, "chrismas");
      generateGrid(extraData, "extra");

      loadProgress();
      updateStatus();
    };

    // --- (以下、check, saveProgressなどは変更なしのため省略可能ですが、そのまま残してください) ---
    function check(element) {
      element.classList.toggle("owned");
      saveProgress();
      updateStatus();
    }
    function saveProgress() {
      const ownedElements = document.querySelectorAll(".char-item.owned");
      const ownedIds = Array.from(ownedElements).map(el => el.id);
      localStorage.setItem("nyanko_save", JSON.stringify(ownedIds));
    }
    function loadProgress() {
      const savedData = localStorage.getItem("nyanko_save");
      if (!savedData) return;
      const ownedIds = JSON.parse(savedData);
      ownedIds.forEach(id => {
        const target = document.getElementById(id);
        if (target) target.classList.add("owned");
      });
    }
    function updateStatus() {
      const all = document.querySelectorAll(".char-item").length;
      const owned = document.querySelectorAll(".char-item.owned").length;
      const percent = all > 0 ? Math.floor((owned / all) * 100) : 0;
      document.getElementById("status").textContent = percent;
      document.getElementById("count-display").textContent = `(${owned}/${all})`;
    }
    function resetAll() {
      if (confirm("チェックをすべて外しますか？")) {
        document.querySelectorAll(".char-item.owned").forEach(item => {
          item.classList.remove("owned");
        });
        localStorage.removeItem("nyanko_save");
        updateStatus();
      }
    }
  </script>
</body>
</html>
